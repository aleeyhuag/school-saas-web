[build]
  command = "npm run build"
  publish = "dist"

# React Router handles routing client-side — without this, refreshing
# on any deep link (e.g. /proprietor/students) hits Netlify's server
# directly, which has no idea what that path is and 404s. This tells
# Netlify to always serve index.html and let the app's own router
# take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS/CSS files have a content hash in their name, so a changed file always
# gets a new name. They can be cached for a year: returning visitors reuse them
# from the phone instead of re-checking with the server on every page load.
# (index.html is deliberately NOT cached this way, so new releases still appear.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
