name: Build Android app

# Builds the Skulag Android app on GitHub, so Android Studio is not needed.
#  - Every push to main that touches the app  -> a debug APK you can install to test.
#  - Actions tab -> "Build Android app" -> Run workflow -> choose "release"
#    -> a signed APK + AAB (the AAB is what the Play Store wants).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug = test APK | release = signed APK + AAB for the Play Store'
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: https://api.skulag.com.ng/api
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      - name: Install web dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Prepare signing key (release only)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. See ANDROID-GITHUB-BUILD.md, step 'Add the signing key'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skulag-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/skulag-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: env.BUILD_TYPE != 'release'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Build signed release APK + AAB
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease

      - name: Upload debug APK
        if: env.BUILD_TYPE != 'release'
        uses: actions/upload-artifact@v5
        with:
          name: skulag-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK + AAB
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: skulag-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
